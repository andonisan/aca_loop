# State-action-config mapping — deployed with the orchestrator, never read from the target repo
# (design.md D2). This sample reproduces v1's ds-connect configuration exactly (README.md /
# CONTRIBUTING.md): the two machine gates, /ds:propose and /ds:implement, both on the Claude
# runtime, both failing to status:blocked.
targets:
  - vendor: GitHub
    repo: "your-org/ds-connect"
    states:
      "status:ready-for-proposal":
        action: /ds:propose
        runtime: Claude
        onFailureState: "status:blocked"
      "status:ready-for-implementation":
        action: /ds:implement
        runtime: Claude
        onFailureState: "status:blocked"
# A split tracker/code-host target, for reference. Jira holds the work item and its status but hosts
# no git, so codeHost/codeRepo say where the agent actually clones from. For a vendor that is both
# tracker and git host (every target above), codeHost defaults to vendor and codeRepo to repo, so
# neither field is written -- which is why mappings predating them keep working unchanged.
#
# Note the state names: they are this client's Jira status names verbatim, not a canonical set. The
# mapping is per-target, so status vocabulary is configuration -- see DOCS/jira-status-vocabulary.md
# for the names real Plain Concepts Jira instances actually use.
